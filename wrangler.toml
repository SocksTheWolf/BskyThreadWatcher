name = "onlyuppieswatcher"
main = "src/main.ts"
compatibility_date = "2026-08-02"
minify = true
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = false
preview_urls = false
send_metrics = false

# mirror of file data
[[r2_buckets]]
binding = "R2"
bucket_name = "onlyuppies2"
remote = true

# used for bookkeeping records
# like which posts we've seen
[[kv_namespaces]]
binding = "KV"
id = "743e785ed53f49cca04b90f105c0b84e"

[triggers]
# run at every hour on the hour (if not using queues)
#crons = ["0 */1 * * *"]
# run every 5 minutes (if using queues)
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[queues.producers]]
queue = "bsky-thread-watcher"
binding = "THREAD_UPDATE_QUEUE"

[[queues.consumers]]
queue = "bsky-thread-watcher"
max_batch_size = 3
max_batch_timeout = 3
max_retries = 2

# no webhook = no maidens
[secrets]
required=["WEBHOOK"]

# closest to microcosm data
[placement]
region = "gcp:northamerica-northeast2-a"

[vars]
# constrain yourself
MAX_GALLERY_IMAGES=4
MAX_RECURSE_DEPTH=2

# this is the did for socksthewolf.com, any posts with this DID will not be processed.
SKIP_DID="did:plc:2vueglf2njr5gvdbaf75ih6a"

# if cf queues can be used, if so, then you've got much longer to process data (and can do it more frequently)
USE_QUEUES = "true"

# target post on atproto
# use pdsls.dev to get this link (check info tab for one click copy)
TARGET=""