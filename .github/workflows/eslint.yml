name: ESLint
on:
  push:
    branches: [ "main" ]
    paths:
      - "src/*"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
    paths:
      - "src/*"

jobs:
  run:
    name: Scan
    uses: socksthewolf/workflows/.github/workflows/run_eslint.yml@main
    with:
      ref: ${{ github.ref }}
      needs_build: false
